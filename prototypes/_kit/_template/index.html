<body>

<!-- ── scenbar (обязателен) ─────────────────────────────────────────── -->
<div class="scenbar">
  <div class="sb-left"><b>QATO-XXXX</b><span class="pill">прототип</span></div>
  <div class="sb-center">
    <select id="scen-select">
      <optgroup label="Экран">
        <option value="scr-a">Сценарий A — …</option>
        <option value="scr-b">Сценарий B — …</option>
      </optgroup>
    </select>
    <button class="navbtn" data-action="prev-scen"><i data-lucide="chevron-left"></i></button>
    <button class="navbtn" data-action="next-scen"><i data-lucide="chevron-right"></i></button>
  </div>
  <div class="sb-right">
    <button class="resetbtn" data-action="reset"><i data-lucide="rotate-ccw" width="13" height="13"></i> сброс</button>
  </div>
</div>

<!-- ── stage: по одному .screen на состояние ────────────────────────────
     Вставь в .screen разметку готового экрана из _kit/screens/<screen>/
     (например recipes-list/full.html). prod.css уже подключён, ассеты в ./assets/.
     Корень экрана оставь h-full (не h-screen). Правь тексты/данные под сценарий;
     новую интерактивность бери из аналогов (готовые экраны, Storybook, DESIGN.md).
     Нужного экрана нет в _kit/screens/ — добавь через скилл refresh-templates. -->
<div id="stage">
  <section class="screen active" id="scr-a">
    <!-- разметка экрана для состояния A -->
  </section>
  <section class="screen" id="scr-b">
    <!-- разметка экрана для состояния B -->
  </section>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  // плоский список состояний для стрелок ‹ › (порядок = порядок листания)
  window.SCEN = ['scr-a','scr-b'];

  // побочные эффекты при переключении состояния (бейджи, тексты и т.п.)
  window.applyScenario = function(id){
    // if(id==='scr-b'){ ... }
  };
</script>
<!-- общий рантайм kit: scenbar, меню, toast, переключение состояний -->
<script src="./proto.js"></script>
</body>
</html>
